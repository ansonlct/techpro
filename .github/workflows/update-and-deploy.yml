name: Update news and deploy website

on:
  workflow_dispatch:
  schedule:
    - cron: "0,15,30,45 * * * *"
      timezone: "Asia/Hong_Kong"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "web/**"
      - "config.json"
      - "keywords.txt"
      - "url_overrides.json"
      - "requirements.txt"
      - ".github/workflows/update-and-deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore rolling news database
        uses: actions/cache@v6
        with:
          path: runtime/news_monitor.db
          key: news-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            news-db-${{ runner.os }}-

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Collect news and build static data
        env:
          TZ: Asia/Hong_Kong
          PYTHONUTF8: "1"
        run: python scripts/build_web_data.py --workers 10 --retention-days 14

      - name: Validate website package
        run: |
          python scripts/validate_web.py
          node --check web/assets/app.js
          node --check web/service-worker.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
